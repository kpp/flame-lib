[package]
name = "mint-playground"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the demo's dependencies and lockfile separate from the protocol workspace.
[workspace]

[dependencies]
axum = "0.8"
flamekd = { path = "../../flamekd" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
merlin = { git = "https://github.com/runflame/merlin", rev = "fcc51efb4fc0b47e1a004cfe3aef65f47c5612f0" }
